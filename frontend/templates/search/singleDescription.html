<!DOCTYPE html>
<html lang="en">

<head th:insert="~{fragments/header ::head_base}">
    <title id="pageTitle">WUD Games</title>
</head>

<body id="root">
    <div th:replace="~{fragments/header ::navbar}">The header should go here</div>
    <span th:if="${show_editor != true}">
        <span th:replace="~{fragments/managementOptions :: managementOptions(${descriptionAndAvailability})}">
            Management Options
        </span>
    </span>
    <form action="/manage/inventory/updateOrCreate" method="post" th:object="${description}">
        <input type="hidden" th:value="${description_type}" name="description_type">
        <span th:if="${description instanceof T(edu.wisc.wud.games.wud_games_website.general_dis.GeneralDisDTO)}">
            <input type="hidden" th:field="*{id}">
            <!-- add a prefill link option (link from steam or bgg) here -->
            <div class="media">
                <div class="content">
                    <h3>
                        <span th:if="${show_editor != true}" th:text="${description.name}">Name</span>
                        <input th:if="${show_editor == true}" id="name" aria-label="Name" type="text" th:field="*{name}"
                            th:value="${name}" />
                    </h3>
                    <p th:if="${show_editor != true}" th:text="${description.description}">description</p>
                    <textarea th:if="${show_editor == true}" id="description" aria-label="Description" type="text"
                        th:field="*{description}"></textarea>
                    <!-- Add tags fields here -->
                </div>
                <img th:if="${show_editor != true}" th:src="${description.imageUrl}" alt="Description Image" class="img"
                    src="https://cf.geekdo-images.com/TrBdhHzDw10cTw26V2QXkw__imagepage/img/ooPOAjbwO5DjZOWwzVpwe7A5jw8=/fit-in/900x600/filters:no_upscale():strip_icc()/pic184991.jpg">
                <span th:if="${show_editor == true}">
                    <label for="imageUrl">Image Url</label>: <input id="imageUrl" type="url" th:field="*{imageUrl}" />
                </span>
            </div>
        </span>
        <span th:if="${description instanceof T(edu.wisc.wud.games.wud_games_website.game_dis.GameDisDTO)}">
            <div th:if="${show_editor != true}">
                Min player count: <span th:text="*{minPlayers}"></span>
                Max player count: <span th:text="*{maxPlayers}"></span>
            </div>
            <span th:if="${show_editor == true}">
                <label for="minPlayers">Min player count</label>: <input id="minPlayers" type="number"
                    th:field="*{minPlayers}" />
                <label for="maxPlayers">Max player count</label>: <input id="maxPlayers" type="number"
                    th:field="*{maxPlayers}" />
                <br>
            </span>
        </span>
        <span th:if="${description instanceof T(edu.wisc.wud.games.wud_games_website.board_game_dis.BoardGameDisDTO)}">
            <div th:if="${show_editor != true}">
                Min playtime (minutes): <span th:text="*{minPlaytime}"></span>
                Max playtime (minutes): <span th:text="*{maxPlaytime}"></span>
            </div>
            <span th:if="${show_editor == true}">
                <label for="minPlaytime">Min playtime (minutes)</label>: <input id="minPlaytime" type="number"
                    th:field="*{minPlaytime}" />
                <label for="maxPlaytime">Max playtime (minutes)</label>: <input id="maxPlaytime" type="number"
                    th:field="*{maxPlaytime}" />
                <br>
            </span>
        </span>
        <span
            th:if="${description instanceof T(edu.wisc.wud.games.wud_games_website.board_game_expansion_dis.BoardGameExpansionDisDTO)}">
            <span th:if="${show_editor == true}">
                <div>BoardGameExpansionDis fields WIP</div>
                <!-- Add selecting what this is an expansion to here -->
            </span>
        </span>
        <!--
            <span th:if="${description instanceof T(edu.wisc.wud.games.wud_games_website.video_game_expansion_dis.VideoGameExpansionDisDTO)}">
                <div>VideoGameExpansionDis fields</div>
                <!- - Add selecting what this is an expansion to here - ->
            </span>
            -->
        <div>
            <input th:if="${show_editor == true}" type="submit" value="Submit" aria-label="Submit">
        </div>
    </form>
    <span th:if="${description instanceof T(edu.wisc.wud.games.wud_games_website.board_game_dis.BoardGameDisDTO)}"
        sec:authorize="hasRole('PHYSICAL_INVENTORY_MANAGER')">
        <form method="get" th:action="@{/api/manage/createItem}">
            <input type="hidden" name="description_id" th:value="${description.id}">
            <button type="submit">Add Copy (WIP)</button>
        </form>
    </span>
    <input type="hidden" name="description_id" th:value="${description.id}">
    <span hx-target="find #itemsTable" hx-get="/library/itemsTable" hx-trigger="load, submit from:[name='create_copy']"
        hx-include="[name='description_id']">
        <span id="itemsTable">Loading Items...</span>
    </span>
</body>

</html>
