<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" user-scalable=yes />
    <meta name="robots" content="index,follow">
    <link rel="stylesheet" href="style.css" />
    <title>WUDGames Website</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.js"
        integrity="sha384-Q+Dky3iHVJOr6wUjQ4ulh6uQ76an/t+ak1+PjMVaxRjbZamFLAG+u9InkfjbsEQf"
        crossorigin="anonymous"></script>
</head>

<body th:fragment="searchresult">
    <div>Filter summery will go here</div>
    <div class="tilegrid">

        <div th:each="tiledata: ${resultsList}" class="overlay">
            <div class="overlay__content">
                <a sec:authorize="hasRole('HOST')"
                    th:if="${tiledata.allItems.size() - tiledata.checkedOutItems.size() > 0}">
                    <button>Checkout (WIP)</button>
                </a>
                <a sec:authorize="hasRole('HOST')"
                    th:if="${tiledata.checkedOutItems.size() > 0}">
                    <button>Return (WIP)</button>
                </a>
                <span th:replace="~{fragments/managementOptions :: managementOptions(${tiledata})}">
                    Management Options
                </span>
            </div>
            <a th:href="@{~/library/{id}/{name}(id=${tiledata.description.id},name=${tiledata.description.name})}">
                <div th:replace="~{fragments/tile :: tile(tiledata)}"></div>
            </a>
        </div>
    </div>
</body>

</html>
