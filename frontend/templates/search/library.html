<!DOCTYPE html>
<html lang="en">

<head th:insert="~{fragments/header ::head_base}">
    <title id="pageTitle">WUDGames Library</title>
</head>

<body id="root">
    <div th:replace="~{fragments/header ::navbar}">The header should go here</div>
    <a sec:authorize="hasRole('PHYSICAL_INVENTORY_MANAGER')" href="/manage/inventory/create">
        <button>Create Item</button>
    </a>
    <br>
    <span class="dropdown-menu">
        <label class="dropdown-menu__toggle" for="type-toggle">
            Type Filters
        </label>
        <input class="dropdown-menu__input" type='checkbox' id="type-toggle">
        <div class="dropdown-menu__content">
            <form hx-target="#filterOptions" hx-get="/library/filterOptions" hx-trigger="load, change delay:0.5" hx-include="this">
                <!-- This is the description type, such as board game or video game is selected. -->
                Description type selection
                <div>
                    <label for="board-game-type">Board Game</label>
                    <input type="checkbox" name="type" value="Board Game" id="board-game-type" checked>
                </div>
                <div>
                    <label for="board-game-expansion-type">Board Game Expansion</label>
                    <input type="checkbox" name="type" value="Board Game Expansion" id="board-game-expansion-type" checked>
                </div>
                <div>
                    <label for="video-game-type">Video Game</label>
                    <input type="checkbox" name="type" value="Video Game" id="video-game-type">
                </div>
                <!-- Add other description types here -->
            </form>
        </div>
    </span>
    <span id="filterOptions"></span>
    <div th:insert="~{search/result :: searchresult}" class="searchresult"></div>
</body>

</html>
