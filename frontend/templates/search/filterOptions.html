<!DOCTYPE html>
<html lang="en">

<head th:insert="~{fragments/header ::head_base}">
    <title id="pageTitle">Filter Options</title>
</head>

<body>
    <form hx-target=".searchresult" hx-get="/api/search" hx-trigger="load, change changed delay:0.5"
        hx-include="[name='searchterm'],[name='tags']" hx-ext="push-url-w-params" data-push-url="/library">
        <!-- These are the search/filter options, they are based on the types selected above. -->
        <div>This is the filter options</div>
        <input type="hidden" name="type" th:value="${commonAncestor.getName()}">
        <span
            th:if="${T(edu.wisc.wud.games.wud_games_website.general_dis.GeneralDisDTO).isAssignableFrom(commonAncestor)}">
            <label for="searchterm">Name Search: </label><input id="searchterm" name="searchterm" type="text"
                th:value="${param.searchterm}" />
        </span>
        <span th:if="${T(edu.wisc.wud.games.wud_games_website.game_dis.GameDisDTO).isAssignableFrom(commonAncestor)}">
            <label for="player-count">Player Count: </label><input id="player-count" name="playerCount" type="number"
                th:value="${param.playerCount}" />
        </span>
        <span
            th:if="${T(edu.wisc.wud.games.wud_games_website.board_game_dis.BoardGameDisDTO).isAssignableFrom(commonAncestor)}">
            <label for="play-time">Playtime (minutes): </label><input id="play-time" name="playTime" type="number"
                th:value="${param.playTime}" />
        </span>
        <!-- <label for="tags">Tags (WIP)</label>: <input id="tags" name="tags" type="text" th:value="${param.tags}" /> -->
        <label for="sort-by">Sort By: </label>
        <select id="sort-by" name="sortBy"
            th:if="${T(edu.wisc.wud.games.wud_games_website.general_dis.GeneralDisDTO).isAssignableFrom(commonAncestor)}">
            <option>Name</option>
            <option>Popularity (WIP)</option>
            <option th:if="${T(edu.wisc.wud.games.wud_games_website.game_dis.GameDisDTO).isAssignableFrom(commonAncestor)}">Max Players</option>
            <option th:if="${T(edu.wisc.wud.games.wud_games_website.game_dis.GameDisDTO).isAssignableFrom(commonAncestor)}">Min Players</option>
            <option th:if="${T(edu.wisc.wud.games.wud_games_website.board_game_dis.BoardGameDisDTO).isAssignableFrom(commonAncestor)}">Min Playtime</option>
            <option th:if="${T(edu.wisc.wud.games.wud_games_website.board_game_dis.BoardGameDisDTO).isAssignableFrom(commonAncestor)}">Max Playtime</option>
        </select>
        <label for="sort-order">Sort order: </label>
        <select id="sort-order" name="sortOrder">
            <option>Ascending</option>
            <option>Descending</option>
        </select>
    </form>

</body>

</html>
