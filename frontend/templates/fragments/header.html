<!DOCTYPE html>
<html>

<head th:fragment="head_base">
    <title th:replace="~{:: #pageTitle}">WUDGames Website</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" user-scalable=yes />
    <meta name="robots" content="index,follow">
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.js"
        integrity="sha384-Q+Dky3iHVJOr6wUjQ4ulh6uQ76an/t+ak1+PjMVaxRjbZamFLAG+u9InkfjbsEQf"
        crossorigin="anonymous"></script>
    <script type="text/javascript" src="/js/htmx.push-url-w-params.js"></script>
</head>

<body>
  <div th:fragment="navbar" class="navbar">
    <a href="/" class="navbar__logo" >
      <img class="img--heightconstrained" src="/images/WhiteColorLogo.png" alt="Games Committee Wisconsin Union Directorate">
    </a>
    <nav class="navbar__links">
      <a class="navbar__option" href="/library">Library</a>
      <a sec:authorize="hasRole('HOST')" class="navbar__option" href="/host/dashboard">
        Host Dashboard
      </a>
      <a sec:authorize="hasRole('ADMIN')" class="navbar__option" href="/manage/admin">
        Admin Dashboard
      </a>
      <div class=navbar__separator></div>
      <a class="navbar__option" href="/myuser">
        <div class="navbar__username">
          <span sec:authorize="isAuthenticated()" th:text="${session.user_name}">User Name</span>
          <span sec:authorize="isAuthenticated()" sec:authentication="principal.email">User Email</span>
          <span sec:authorize="!isAuthenticated()">Sign In</span>
        </div>
        <img th:if="${session.user_profile_picture != null}" th:src="${session.user_profile_picture}" alt="User Profile Picture" class="img profileIcon">
      </a>
    </nav>
  </div>
</body>

</html>
