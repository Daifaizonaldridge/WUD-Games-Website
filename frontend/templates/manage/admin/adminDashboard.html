<!DOCTYPE html>
<html lang="en">

<head th:insert="~{fragments/header ::head_base}">
    <title id="pageTitle">Admin Dashboard</title>
</head>

<body>
    <div th:replace="~{fragments/header ::navbar}">The header should go here</div>
    This is the admin dashboard.
    <p>
    <form action="/manage/admin/upload" method="post" enctype="multipart/form-data">
        <label for="file">Select .csv file to upload board games</label><input type="file" id="file" name="file"
            accept=".csv">
        <input type="submit" value="Upload" aria-label="Upload">
    </form>
    Add options to export using .csv file.
    </p>
    <form action="#" hx-target="next #searchresult" hx-include="this" hx-get="/manage/admin/userAccounts"
        hx-trigger="load, change changed delay:0.5">
        Search options for user accounts.
        <label for="email">Email</label>: <input id="email" name="email" type="text">
    </form>
    <form method="get" action="/manage/admin/editUserAccount">
        <button type="submit">
            Create New Account
        </button>
    </form>
    <p id="searchresult">
        UserAccounts table with option to edit perms.
    </p>
</body>

</html>
