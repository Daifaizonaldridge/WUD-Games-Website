<!DOCTYPE html>
<html lang="en">

<head th:insert="~{fragments/header ::head_base}">
    <title id="pageTitle">Admin Dashboard</title>
</head>

<body>
    <div th:replace="~{fragments/header ::navbar}">The header should go here</div>
    This is the host dashboard.
    <table>
        <tr>
            <td>Recipient Name</td>
            <td>Items</td>
            <td>People</td>
            <td>Checkout Time</td>
            <td>Options</td>
        </tr>
        <tr th:each="rowData : ${checkoutRecordsAndItems}">
            <td th:text="${rowData.record.recipientName}"></td>
            <td>
                <span th:each="item : ${rowData.items}" th:text="${item.genDis.name}"></span>
            </td>
            <td th:text="${rowData.record.peoplePlaying}"></td>
            <td th:text="${#temporals.format(rowData.record.checkoutTime, 'yyyy-MM-dd HH:mm', userTimeZone)}"></td>
            <td>
                <form method="post" th:action="@{/manage/checkout/return}">
                    <input type="hidden" name="checkoutRecord_id" th:value="${rowData.record.id}">
                    <button type="submit">Return</button>
                </form>
            </td>
        </tr>
    </table>
</body>

</html>
