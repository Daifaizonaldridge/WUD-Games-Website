spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: ${JDBC_DATABASE_USERNAME:sa}
    password: ${JDBC_DATABASE_PASSWORD:}
    admin-email: ${DEFAULT_ADMIN_EMAIL}
    defaultAdminPassword: ${DEFAULT_ADMIN_PASSWORD}
    # the database should then have "host all all all scram-sha-256" in pg_hba.conf
    # for local development the user is create on the database from compose.yaml
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${OAUTH2_GOOGLE_CLIENT_ID}
            clientSecret: ${OAUTH2_GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
  ai:
    ollama:
      init:
        pull-model-strategy: when_missing
        chat:
          include: true
      embedding:
        # info on models https://ollama.com/blog/embedding-models
        model: nomic-embed-text
      base-url: http://localhost:11435
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: hnsw
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
logging:
  level:
    web: DEBUG
