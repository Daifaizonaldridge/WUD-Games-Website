info:
  name: DELETE location by id
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseURL}}/api/locations/{{id}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
