info:
  name: GET location by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/api/locations/{{id}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.name
      operator: eq
      value: '"{{name}}"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
