info:
  name: "GET inventory item by id #2"
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseURL}}/api/inventoryItems/{{id}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.dateAdded
      operator: eq
      value: "{{dateAdded}}"
    - expression: res.body.notes
      operator: eq
      value: "{{notes}}"
    - expression: res.body.genDis
      operator: eq
      value: "{{genDis_id}}"
    - expression: res.body.currentCheckout
      operator: eq
      value: "{{currentCheckout_id}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
