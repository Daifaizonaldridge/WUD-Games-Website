info:
  name: GET general discription by id
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}/api/generalDiss/{{id}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.name
      operator: eq
      value: '"{{name}}"'
    - expression: res.body.description
      operator: eq
      value: '"{{description}}"'
    - expression: res.body.imageUrl
      operator: eq
      value: '"{{imageUrl}}"'
    - expression: res.body.tags
      operator: contains
      value: "{{tag_id}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
