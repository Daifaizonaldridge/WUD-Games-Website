info:
  name: GET game discription by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/api/gameDiss/{{id}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{id}}"
    - expression: res.body.minPlayers
      operator: eq
      value: "{{minPlayers}}"
    - expression: res.body.maxPlayers
      operator: eq
      value: "{{maxPlayers}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
