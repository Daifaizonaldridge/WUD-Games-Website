info:
  name: GET game expantion discription by id
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}/api/gameExpansionDiss/{{id}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{id}}"
    - expression: res.body.baseGameDis
      operator: eq
      value: "{{gameDis_id}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
