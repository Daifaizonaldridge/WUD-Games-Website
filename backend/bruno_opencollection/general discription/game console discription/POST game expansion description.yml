info:
  name: POST game expansion description
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/api/gameExpansionDiss"
  body:
    type: json
    data: |-
      {
        "baseGameDis": {{gameDis_id}}
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body
        method: jsonq
      variable:
        name: id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
