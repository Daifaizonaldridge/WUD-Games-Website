info:
  name: POST inventory item
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/api/inventoryItems"
  body:
    type: json
    data: |-
      {
        "dateAdded": "{{$isoTimestamp}}",
        "notes": "{{$randomAdjective}}",
        "currentCheckout": null,
        "genDis": {{genDis_id}}
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body
        method: jsonq
      variable:
        name: inventoryitem_id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
