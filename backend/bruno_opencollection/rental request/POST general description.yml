info:
  name: POST general description
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/api/generalDiss"
  body:
    type: json
    data: |-
      {
        "name": "{{$randomCatchPhraseAdjective}} {{$randomCatchPhraseNoun}}",
        "description": "{{$randomCatchPhraseAdjective}}",
        "imageUrl": "{{$randomCatsImage}}",
        "tags": []
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body
        method: jsonq
      variable:
        name: genDis_id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
