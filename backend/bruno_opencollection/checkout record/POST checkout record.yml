info:
  name: POST checkout record
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/api/checkoutRecords"
  body:
    type: json
    data: |-
      {
        "checkoutTime": "{{$isoTimestamp}}",
        "returnedTime": null,
        "peoplePlaying": {{$randomInt}},
        "resipeantName": "{{$randomFullName}}",
        "inventoryItems": [{{inventoryItem_id}}]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body
        method: jsonq
      variable:
        name: id
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: req.body.checkoutTime
        method: jsonq
      variable:
        name: checkoutTime
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: req.body.peoplePlaying
        method: jsonq
      variable:
        name: peoplePlaying
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: req.body.resipeantName
        method: jsonq
      variable:
        name: resipeantName
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
